server {
    listen 8080;
    # localhost resolves to ::1 first inside the container, so binding IPv4
    # only would leave the health probe connecting to a closed port.
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx advertises its exact version by default, which is free
    # reconnaissance for anyone scanning for known bugs.
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Lets the edge report whether the API behind it is actually up.
    location = /health {
        proxy_pass http://api:8080/health;
        access_log off;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;

        # Vite fingerprints these filenames, so they are safe to cache hard.
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;

        # Single-page app: unknown paths are routes, not missing files.
        try_files $uri $uri/ /index.html;

        # The shell must never be cached, or a deploy leaves clients on an old
        # bundle pointing at fingerprinted assets that no longer exist.
        add_header Cache-Control "no-store" always;
    }
}
